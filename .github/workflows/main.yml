name: Antimony CICD
run-name: ${{ github.actor }} is running CICD Pipelines
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  frontend-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install and Run webpack 🔧
        run: |
          cd vscode-antimony/
          npm install
          npm run webpack

  backend-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 3.10 to match the interpreter the extension actually ships. Testing on
      # a different Python than users run is how version-specific breakage gets
      # through CI unnoticed.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # The previous version installed pygls, bioservices, and requests
      # unpinned, so CI silently drifted to whatever was newest on PyPI. That
      # is why this workflow broke: pygls 1.0 removed pygls.workspace.Document,
      # which test_grammar.py imports, and bioservices 1.16 pulls an easydev
      # that conflicts with the vendored bioservices_server copy.
      #
      # requirements-runtime.txt is the single source of truth for these pins
      # and is what gets baked into the shipped runtime, so testing against it
      # means CI exercises the same stack users get.
      - name: Install dependencies
        run: |
          cd vscode-antimony/
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest
          python3 -m pip install -r requirements-runtime.txt

      - name: Test with pytest
        run: |
          cd vscode-antimony/src/server/stibium/
          python3 -m pytest test/ -v